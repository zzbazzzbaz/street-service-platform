name: Backend Docker

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/backend/docker-compose.yml"
      - ".gitea/workflows/backend-docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "deploy/backend/docker-compose.yml"
      - ".gitea/workflows/backend-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: git.gqt.plus
  IMAGE_NAME: gqt/street-service-digitalization-backend

jobs:
  docker-build:
    name: Build and push backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t street-service-digitalization-backend:ci \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }} \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            backend

      - name: Login to Gitea Container Registry
        if: gitea.event_name != 'pull_request'
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${REGISTRY} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Push backend image
        if: gitea.event_name != 'pull_request'
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ gitea.sha }}
          docker push ${REGISTRY}/${IMAGE_NAME}:latest

  deploy-backend:
    name: Deploy backend container
    runs-on: ubuntu-latest
    needs: docker-build
    if: gitea.event_name != 'pull_request'
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: REGISTRY,IMAGE_NAME,REGISTRY_USERNAME,REGISTRY_TOKEN
          script_stop: true
          script: |
            set -eu

            cd /home/ubuntu/street-service-digitalization-backend

            if [ -n "${REGISTRY_TOKEN:-}" ]; then
              echo "$REGISTRY_TOKEN" | sudo docker login "$REGISTRY" -u "${REGISTRY_USERNAME:-gqt}" --password-stdin
            fi

            sudo docker compose pull backend
            sudo docker compose up -d backend
            sudo docker compose exec -T backend python manage.py migrate
            sudo docker compose exec -T backend python manage.py collectstatic --noinput
            sudo docker compose exec -T backend python manage.py check
            sudo docker compose exec -T backend python manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); user, created = User.objects.get_or_create(username='admin', defaults={'is_staff': True, 'is_superuser': True}); user.is_staff=True; user.is_superuser=True; user.set_password('admin123456'); user.save()"
            sudo docker image prune -f

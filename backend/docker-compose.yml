services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: street
      POSTGRES_PASSWORD: street
      POSTGRES_DB: street
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U street"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: street
      DJANGO_DB_USER: street
      DJANGO_DB_PASSWORD: street
      DJANGO_REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      ACCESS_TOKEN_EXPIRES_SECONDS: "7200"
      WECHAT_MINIAPP_APPID: ${WECHAT_MINIAPP_APPID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:

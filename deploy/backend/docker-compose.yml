services:
  backend:
    image: git.gqt.plus/gqt/street-service-digitalization-backend:latest
    container_name: street-service-digitalization-backend
    restart: unless-stopped
    network_mode: host
    command: >
      sh -c "python manage.py migrate &&
      gunicorn config.wsgi:application --bind 127.0.0.1:18002 --workers 3 --access-logfile - --error-logfile -"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-change-me}"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_DB_NAME: "${DJANGO_DB_NAME:-street}"
      DJANGO_DB_USER: "${DJANGO_DB_USER:-street}"
      DJANGO_DB_PASSWORD: "${DJANGO_DB_PASSWORD:-street}"
      DJANGO_DB_HOST: "${DJANGO_DB_HOST:-127.0.0.1}"
      DJANGO_DB_PORT: "${DJANGO_DB_PORT:-5432}"
      DJANGO_REDIS_URL: "${DJANGO_REDIS_URL:-redis://127.0.0.1:6379/0}"
      ACCESS_TOKEN_EXPIRES_SECONDS: "7200"
      WECHAT_MINIAPP_APPID: "${WECHAT_MINIAPP_APPID:-}"
      WECHAT_MINIAPP_SECRET: "${WECHAT_MINIAPP_SECRET:-}"
      RATELIMIT_ENABLE: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./media:/app/data/media
